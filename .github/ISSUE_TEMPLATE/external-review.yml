name: External review
description: Independent review of the LTP evidence package
title: "External review: LTP v0.2 evidence package"
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reviewing LTP.

        Suggested reading order:
        1. `docs/TECHNICAL_REPORT_DRAFT.md`
        2. `benchmark/RESULTS.md`
        3. `docs/SHOWCASE_TRACES.md`
        4. `docs/BASELINE_COMPARISON.md`
        5. `docs/DOMAIN_CASE_STUDIES.md`
        6. `docs/EVALUATION_PROTOCOL.md`
        7. `docs/GRANT_100K_EVIDENCE_PLAN.md`

        Optional reviewer packet: `docs/EXTERNAL_REVIEWER_PACKET.md`
  - type: textarea
    id: reviewer-background
    attributes:
      label: Reviewer background
      description: Briefly describe relevant background or perspective.
      placeholder: AI safety, agent infrastructure, QA/devtools, compliance, research, etc.
    validations:
      required: false
  - type: dropdown
    id: recommendation
    attributes:
      label: Overall recommendation for $100k-$150k funding consideration
      options:
        - Yes
        - Maybe
        - No
        - Not enough context
    validations:
      required: true
  - type: textarea
    id: strongest-point
    attributes:
      label: Strongest point
      description: What is most compelling about the evidence package?
    validations:
      required: false
  - type: textarea
    id: main-concern
    attributes:
      label: Main concern
      description: What is weakest, unclear, or most risky?
    validations:
      required: false
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Did you run the validation commands? If yes, what happened?
      value: |
        Commands, if run:

        ```bash
        corepack enable
        corepack prepare pnpm@9.15.0 --activate
        pnpm install --frozen-lockfile
        pnpm test
        pnpm test:conformance
        python scripts/run_benchmark.py
        python scripts/run_benchmark.py --markdown-out benchmark/RESULTS.md
        git status
        ```
    validations:
      required: false
  - type: textarea
    id: claim-discipline
    attributes:
      label: Claim discipline
      description: Are the claims narrow enough? Any overclaims?
    validations:
      required: false
  - type: textarea
    id: benchmark-feedback
    attributes:
      label: Benchmark feedback
      description: Is the 115-case deterministic scaffold useful? What should be added or changed?
    validations:
      required: false
  - type: textarea
    id: funding-advice
    attributes:
      label: Funding advice
      description: What would make this more fundable?
    validations:
      required: false

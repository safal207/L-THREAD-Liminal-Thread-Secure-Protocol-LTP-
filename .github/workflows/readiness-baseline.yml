name: Production Readiness Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/production/readiness-baseline.json"
      - "docs/production/READINESS_BASELINE.md"
      - "scripts/validate-readiness-baseline.py"
      - "sdk/js/package.json"
      - "sdk/python/setup.py"
      - "sdk/rust/ltp-client/Cargo.toml"
      - "sdk/elixir/mix.exs"
      - ".github/workflows/test.yml"
      - ".github/workflows/p0-security-regressions.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/readiness-baseline.yml"
      - "README.md"
      - "SECURITY_SYNC_STATUS.md"
  push:
    branches: [main]
    paths:
      - "tests/production/readiness-baseline.json"
      - "docs/production/READINESS_BASELINE.md"
      - "scripts/validate-readiness-baseline.py"
      - "sdk/js/package.json"
      - "sdk/python/setup.py"
      - "sdk/rust/ltp-client/Cargo.toml"
      - "sdk/elixir/mix.exs"
      - ".github/workflows/test.yml"
      - ".github/workflows/p0-security-regressions.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/readiness-baseline.yml"
      - "README.md"
      - "SECURITY_SYNC_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readiness-baseline:
    name: Validate capability and evidence baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate manifest, evidence paths, versions and report
        run: python scripts/validate-readiness-baseline.py

name: README Quickstart Validation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/quickstart-validation.yml
      - src/**
      - tests/**
      - tools/**
      - sdk/**
      - schemas/**
      - fixtures/**
      - examples/**
      - docs/**
      - benchmark/**
      - ltp/**
      - scripts/**
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/quickstart-validation.yml
      - src/**
      - tests/**
      - tools/**
      - sdk/**
      - schemas/**
      - fixtures/**
      - examples/**
      - docs/**
      - benchmark/**
      - ltp/**
      - scripts/**
  workflow_dispatch:

jobs:
  quickstart-validation:
    name: Validate README quickstart and benchmark scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run reviewer-safe test suite
        run: pnpm test

      - name: Run conformance tests
        run: pnpm test:conformance

      - name: Run benchmark scaffold
        run: python scripts/run_benchmark.py

      - name: Render benchmark report artifact
        run: python scripts/run_benchmark.py --markdown-out /tmp/ltp-benchmark-results.md

name: WP3 Deterministic Fault and Race Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/fault-injection/**"
      - "tests/fault-injection/**"
      - "docs/production/WP3_FAULT_RACE_CRASH.md"
      - "package.json"
      - ".github/workflows/fault-injection.yml"
  push:
    branches: [main]
    paths:
      - "tools/fault-injection/**"
      - "tests/fault-injection/**"
      - "docs/production/WP3_FAULT_RACE_CRASH.md"
      - "package.json"
      - ".github/workflows/fault-injection.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic chaos seed
        required: false
        default: wp3-scheduled-seed

permissions:
  contents: read

concurrency:
  group: wp3-fault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-fault-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.14"
          otp-version: "25"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic and live-proxy contract tests
        run: pnpm test:fault-injection
      - name: Run four-runtime ownership matrix
        run: pnpm runtime:fault-matrix
      - name: Generate machine-readable evidence
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
        run: |
          SEED="${INPUT_SEED:-wp3-ci-seed}"
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then EXTRA="--extended"; fi
          pnpm fault:scenarios -- --seed "$SEED" \
            --out artifacts/wp3-fault-evidence.json $EXTRA
      - name: Validate evidence and redaction
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const fault = JSON.parse(fs.readFileSync("artifacts/wp3-fault-evidence.json", "utf8"));
          const runtime = JSON.parse(fs.readFileSync("artifacts/wp3-native-runtime-matrix.json", "utf8"));
          if (fault.summary.failed !== 0 || fault.summary.passed !== fault.summary.total) {
            throw new Error(`WP3 contract failed: ${JSON.stringify(fault.summary)}`);
          }
          if (fault.scope.live_proxy_wire_injection !== false) {
            throw new Error("scope boundary changed unexpectedly");
          }
          if (runtime.summary.total !== 4 || runtime.summary.passed !== 4 || runtime.summary.failed !== 0) {
            throw new Error(`runtime matrix failed: ${JSON.stringify(runtime.summary)}`);
          }
          const expected = ["elixir", "javascript", "python", "rust"];
          const actual = runtime.rows.map((row) => row.runtime).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`runtime set mismatch: ${JSON.stringify(actual)}`);
          }
          for (const row of runtime.rows) {
            if (
              row.stale_owner !== "STALE_TRANSPORT_OWNER" ||
              row.replay_after_restart !== "REPLAYED_NONCE" ||
              row.fresh_reset_count !== 1
            ) {
              throw new Error(`runtime invariant failed: ${JSON.stringify(row)}`);
            }
          }
          const raw = JSON.stringify({ fault, runtime });
          for (const forbidden of ["macKey", "encryptionKey", "privateKey", "secretKey", "longTermSecret"]) {
            if (raw.includes(forbidden)) throw new Error(`evidence leaked ${forbidden}`);
          }
          console.log({ fault: fault.summary, runtime: runtime.summary });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: wp3-fault-evidence
          path: |
            artifacts/wp3-fault-evidence.json
            artifacts/wp3-native-runtime-matrix.json
          if-no-files-found: error

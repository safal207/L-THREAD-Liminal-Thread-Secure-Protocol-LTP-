name: WP4 Apply Exact Reference Capacity Patch

on:
  push:
    branches:
      - agent/wp4-capacity-backpressure-limits
    paths:
      - "tools/capacity/apply_reference_server_patch.py"
      - ".github/workflows/wp4-apply-reference-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/wp4-capacity-backpressure-limits
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify exact branch and apply patch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/wp4-capacity-backpressure-limits"
          python tools/capacity/apply_reference_server_patch.py
          grep -q 'getCapacitySnapshot' tools/reference-server/server.ts
          grep -q 'NONCE_CACHE_LIMIT' tools/capacity/limits.ts
          grep -q 'export class ReferenceScenarioClient' tools/reference-server/scenarios.ts
      - name: Remove one-shot patch machinery
        run: |
          rm tools/capacity/apply_reference_server_patch.py
          rm .github/workflows/wp4-apply-reference-patch.yml
      - name: Commit exact patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reference-server/server.ts tools/reference-server/scenarios.ts \
            tools/capacity/apply_reference_server_patch.py \
            .github/workflows/wp4-apply-reference-patch.yml
          git diff --cached --check
          git commit -m "feat(wp4): enforce bounded reference runtime"
          git push origin HEAD:agent/wp4-capacity-backpressure-limits

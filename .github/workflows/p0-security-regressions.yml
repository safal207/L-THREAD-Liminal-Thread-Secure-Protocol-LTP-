name: P0 Security Regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/security/p0/**"
      - "tests/security/canonical-envelope-v1.*"
      - "sdk/js/src/crypto.ts"
      - "sdk/js/src/__tests__/canonicalEnvelopeV1.test.ts"
      - "sdk/python/ltp_client/__init__.py"
      - "sdk/python/ltp_client/client.py"
      - "sdk/python/ltp_client/secure_client.py"
      - "sdk/python/ltp_client/crypto.py"
      - "sdk/python/tests/test_canonical_envelope_v1.py"
      - "sdk/python/tests/test_receive_security_atomicity.py"
      - "sdk/rust/ltp-client/src/client.rs"
      - "sdk/rust/ltp-client/src/crypto.rs"
      - "sdk/rust/ltp-client/tests/canonical_envelope_v1.rs"
      - "sdk/elixir/lib/ltp/connection.ex"
      - "sdk/elixir/lib/ltp/crypto.ex"
      - "sdk/elixir/test/ltp/canonical_envelope_v1_test.exs"
      - "sdk/elixir/test/ltp/connection_security_test.exs"
      - "sdk/elixir/test/ltp/connection_fail_closed_test.exs"
      - ".github/workflows/p0-security-regressions.yml"

permissions:
  contents: read

concurrency:
  group: p0-security-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-regression-suite:
    name: P0 contracts + native security suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.14"
          otp-version: "25"

      - name: Build JavaScript SDK and run canonical contract
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk/js
          npm install --ignore-scripts
          npm run build
          node dist/__tests__/canonicalEnvelopeV1.test.js

      - name: Install Python SDK and run native security contracts
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk/python
          python -m pip install -e ".[dev]"
          cd ../..
          python -m pytest -q \
            sdk/python/tests/test_canonical_envelope_v1.py \
            sdk/python/tests/test_receive_security_atomicity.py

      - name: Run cross-SDK P0 regression contracts
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q tests/security/p0/test_p0_security_regressions.py

      - name: Run Rust native security contracts
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --manifest-path sdk/rust/ltp-client/Cargo.toml --test canonical_envelope_v1
          cargo test --manifest-path sdk/rust/ltp-client/Cargo.toml --lib client::tests

      - name: Run Elixir native security contracts
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk/elixir
          mix deps.get
          mix test --trace \
            test/ltp/canonical_envelope_v1_test.exs \
            test/ltp/connection_security_test.exs \
            test/ltp/connection_fail_closed_test.exs

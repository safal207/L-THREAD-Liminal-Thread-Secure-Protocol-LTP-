name: P0 Security Regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/security/p0/**"
      - "tests/security/canonical-envelope-v1.*"
      - "sdk/js/src/crypto.ts"
      - "sdk/js/src/__tests__/canonicalEnvelopeV1.test.ts"
      - "sdk/python/ltp_client/__init__.py"
      - "sdk/python/ltp_client/client.py"
      - "sdk/python/ltp_client/secure_client.py"
      - "sdk/python/ltp_client/crypto.py"
      - "sdk/python/tests/test_canonical_envelope_v1.py"
      - "sdk/python/tests/test_receive_security_atomicity.py"
      - "sdk/rust/ltp-client/src/client.rs"
      - "sdk/rust/ltp-client/src/crypto.rs"
      - "sdk/rust/ltp-client/tests/canonical_envelope_v1.rs"
      - "sdk/elixir/lib/ltp/connection.ex"
      - "sdk/elixir/lib/ltp/crypto.ex"
      - "sdk/elixir/test/ltp/canonical_envelope_v1_test.exs"
      - "sdk/elixir/test/ltp/connection_security_test.exs"
      - "sdk/elixir/test/ltp/connection_fail_closed_test.exs"
      - ".github/workflows/p0-security-regressions.yml"

permissions:
  contents: read

concurrency:
  group: p0-security-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-regression-suite:
    name: Four confirmed P0 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build JavaScript SDK used by differential test
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk/js
          npm install --ignore-scripts
          npm run build

      - name: Install Python SDK and test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk/python
          python -m pip install -e ".[dev]"

      - name: Run P0 regression contracts
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q tests/security/p0/test_p0_security_regressions.py

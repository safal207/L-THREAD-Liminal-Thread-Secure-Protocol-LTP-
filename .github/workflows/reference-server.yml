name: Reference Server Scenarios

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/reference-server/**"
      - "tests/e2e/four-sdk/**"
      - "sdk/js/src/client.ts"
      - "sdk/python/ltp_client/client.py"
      - "sdk/rust/ltp-client/**"
      - "sdk/elixir/lib/ltp/**"
      - "scripts/wp2_apply_matrix_support.py"
      - "scripts/wp2_adapter_fixes.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/reference-server.yml"
  push:
    branches: [main]
    paths:
      - "tools/reference-server/**"
      - "tests/e2e/four-sdk/**"
      - "sdk/js/src/client.ts"
      - "sdk/python/ltp_client/client.py"
      - "sdk/rust/ltp-client/**"
      - "sdk/elixir/lib/ltp/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/reference-server.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp2-four-sdk-matrix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 511
    name: Build and verify four-SDK wire matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout WP2 head
        uses: actions/checkout@v6
        with:
          ref: production/wp2-four-sdk-e2e
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.14"
          otp-version: "25"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Apply exact WP2 matrix support
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/wp2_apply_matrix_support.py
          python scripts/wp2_adapter_fixes.py

      - name: Format changed language files
        shell: bash
        run: |
          set -euxo pipefail
          rustfmt --edition 2021 \
            sdk/rust/ltp-client/src/client.rs \
            sdk/rust/ltp-client/src/types.rs \
            sdk/rust/ltp-client/src/client/reference_interop_tests.rs
          cd sdk/elixir
          mix deps.get
          mix format \
            lib/ltp/client.ex \
            lib/ltp/connection.ex \
            ../../tests/e2e/four-sdk/elixir_adapter.exs

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
          python -m pip install -e "sdk/python[dev]"
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Verify patched reference contracts
        run: pnpm test:reference-server

      - name: Run four-SDK matrix
        run: pnpm e2e:four-sdk

      - name: Validate matrix and evidence redaction
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/four-sdk-interoperability.json', 'utf8'));
          if (report.summary.total !== 40 || report.summary.passed !== 40 || report.summary.failed !== 0) {
            throw new Error(`four-SDK matrix failed: ${JSON.stringify(report.summary)}`);
          }
          if (report.adapters.length !== 4) throw new Error('expected four native adapters');
          const raw = JSON.stringify(report);
          for (const forbidden of ['ltp-reference-long-term-secret', 'macKey', 'encryptionKey', 'privateKey']) {
            if (raw.includes(forbidden)) throw new Error(`matrix leaked forbidden token: ${forbidden}`);
          }
          console.log(report.summary);
          NODE

      - name: Commit verified matrix implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tests/e2e/WP2.md
          git add \
            package.json \
            tools/reference-server/protocol.ts \
            tools/reference-server/server.ts \
            tools/reference-server/scenarios.ts \
            tools/reference-server/referenceServer.test.ts \
            sdk/elixir/lib/ltp/connection.ex \
            sdk/rust/ltp-client/Cargo.toml \
            sdk/rust/ltp-client/src/client.rs \
            sdk/rust/ltp-client/src/client/reference_interop_tests.rs \
            tests/e2e/four-sdk \
            docs/production/FOUR_SDK_INTEROPERABILITY.md
          git add -u tests/e2e/WP2.md
          if git diff --cached --quiet; then
            echo "WP2 matrix implementation is already committed"
          else
            git commit -m "test: prove four-SDK wire interoperability"
            git push origin HEAD:production/wp2-four-sdk-e2e
          fi

      - name: Upload four-SDK evidence
        uses: actions/upload-artifact@v4
        with:
          name: four-sdk-interoperability
          path: |
            artifacts/four-sdk-interoperability.json
            artifacts/four-sdk/*.json
            docs/production/FOUR_SDK_INTEROPERABILITY.md
          if-no-files-found: error

  reference-server-contracts:
    name: Independent server + deterministic wire scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run reference-server contracts
        run: pnpm test:reference-server

      - name: Generate deterministic evidence
        run: pnpm reference:scenarios

      - name: Validate evidence summary and redaction
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/reference-server-evidence.json', 'utf8'));
          if (report.summary.failed !== 0 || report.summary.total < 12) {
            throw new Error(`reference scenarios failed: ${JSON.stringify(report.summary)}`);
          }
          const raw = JSON.stringify(report);
          for (const forbidden of ['ltp-reference-long-term-secret', 'macKey', 'encryptionKey', 'privateKey']) {
            if (raw.includes(forbidden)) throw new Error(`evidence leaked forbidden token: ${forbidden}`);
          }
          console.log(report.summary);
          NODE

      - name: Upload reference-server evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-server-evidence
          path: artifacts/reference-server-evidence.json
          if-no-files-found: error
